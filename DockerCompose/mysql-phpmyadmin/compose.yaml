name: dc-mysql-phpmyadmin

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DC_MYSQL_ROOT_PASSWORD:?Set DC_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: lab_database
      MYSQL_USER: lab_user
      MYSQL_PASSWORD: ${DC_MYSQL_PASSWORD:?Set DC_MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 300M
    ports:
      - "127.0.0.1:8083:80"

volumes:
  mysql_data:
