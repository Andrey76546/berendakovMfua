name: Sync teacher repository

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Get teacher repository
        run: |
          git remote add teacher https://gitflic.ru/project/rurewa/mfua.git
          git fetch teacher

      - name: Merge teacher changes
        run: |
          git checkout main
          git merge teacher/master --allow-unrelated-histories --no-edit

      - name: Push to my repository
        run: |
          git push origin main
